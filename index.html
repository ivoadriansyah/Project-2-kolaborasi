<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatunganYuk — Split Bill Praktis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Aktifkan mode gelap" title="Mode Gelap">🌙</button>
  <div class="container">
    <header>
      <h1>PatunganYuk 🧾</h1>
      <input type="text" id="event-title" placeholder="Nama Acara (misal: Makan Malam)" value="Patungan Nongkrong">
    </header>

    <!-- STEP 1: ANGGOTA -->
    <section class="card">
      <h2>1. Siapa Saja yang Ikut?</h2>
      <form id="member-form" class="inline-form">
        <input type="text" id="member-input" placeholder="Nama teman..." required>
        <button type="submit" class="btn-primary">Tambah</button>
      </form>
      <div id="member-list" class="chip-container"></div>
    </section>

    <!-- STEP 2: ITEM MENU -->
    <section class="card">
      <h2>2. Daftar Pesanan / Pengeluaran</h2>
      <form id="item-form">
        <div class="grid-2">
          <input type="text" id="item-name" placeholder="Nama menu / barang" required>
          <input type="number" id="item-price" placeholder="Harga satuan (Rp)" min="0" required>
        </div>
        <div class="grid-2">
          <input type="number" id="item-qty" placeholder="Jumlah" value="1" min="1" required>
          <div class="checkbox-group-wrapper">
            <label class="small-label">Dibagi ke siapa?</label>
            <div id="item-members-checkbox" class="checkbox-group"></div>
          </div>
        </div>
        <button type="submit" class="btn-primary full-width">+ Tambah Item</button>
      </form>

      <ul id="item-list" class="item-list"></ul>
    </section>

    <!-- STEP 3: BIAYA TAMBAHAN & DISKON -->
    <section class="card">
      <h2>3. Biaya Tambahan & Diskon</h2>
      <div class="grid-2">
        <div>
          <label for="tax-percent">Pajak / PB1 (%)</label>
          <input type="number" id="tax-percent" value="0" min="0" step="0.1">
        </div>
        <div>
          <label for="service-percent">Service Charge (%)</label>
          <input type="number" id="service-percent" value="0" min="0" step="0.1">
        </div>
        <div>
          <label for="delivery-fee">Ongkir / Biaya Lain (Rp)</label>
          <input type="number" id="delivery-fee" value="0" min="0">
        </div>
        <div>
          <label for="discount-amount">Total Diskon / Promo (Rp)</label>
          <input type="number" id="discount-amount" value="0" min="0">
        </div>
      </div>
    </section>

    <!-- STEP 4: RINGKASAN HASIL -->
    <section class="card result-card">
      <h2>4. Ringkasan Tagihan</h2>
      <div id="summary-total" class="summary-total"></div>
      <div id="summary-list" class="summary-list"></div>

      <div class="action-buttons">
        <button id="copy-wa-btn" class="btn-success">Salin untuk WhatsApp</button>
        <button id="reset-btn" class="btn-danger">Reset Semua</button>
      </div>
    </section>
  </div>

  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
